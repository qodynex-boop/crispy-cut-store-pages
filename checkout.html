</head><body><main class="container section"><a href="menu.html">← العودة للقائمة</a><h1>إتمام الطلب</h1><div class="checkout-layout"><form id="checkoutForm" class="panel"><h2>بيانات العميل</h2><div class="form-grid"><label class="field">الاسم<input name="name" required autocomplete="name"></label><label class="field">رقم الهاتف<input name="phone" required inputmode="tel" autocomplete="tel"></label><label class="field">نوع الطلب<select name="fulfillment"><option>توصيل</option><option>استلام من الفرع</option></select></label><label class="field">المدينة<select name="city"><option>صنعاء</option><option>مدينة أخرى</option></select></label><label class="field">المنطقة<input name="area" required></label><label class="field">الشارع<input name="street" required></label></div><label class="field">العنوان التفصيلي<textarea name="address" required></textarea></label><label class="field">علامة مميزة<input name="landmark"></label><label class="field">وقت الطلب<select name="time"><option>الآن</option><option>لاحقًا</option></select></label><label class="field">طريقة الدفع<select name="payment"><option>نقدًا عند الاستلام</option><option disabled>دفع إلكتروني — قريبًا</option></select></label><label class="field">كود الخصم<input id="coupon" name="coupon"></label><label class="field">ملاحظات الطلب<textarea name="notes"></textarea></label><label><input type="checkbox" name="terms" required> أوافق على الشروط وسياسة الاستخدام</label><button class="btn btn-primary" style="width:100%;margin-top:18px">تأكيد الطلب</button></form><aside class="panel" id="checkoutSummary"></aside></div></main></body></html>
